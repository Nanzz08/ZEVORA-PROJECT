name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip "BASE ZEVORA V1 baru.zip" -d project_raw

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'

      - name: Build APK
        run: |
          cd "project_raw/BASE ZEVORA V1"
          flutter pub get
          
          # 1. Paksa naikkan versi Gradle Wrapper menjadi 9.3.1
          sed -i 's/gradle-8.12-all.zip/gradle-9.3.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-8.12-bin.zip/gradle-9.3.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. Hapus baris 'android.defaults.buildfeatures.buildconfig' yang udah usang
          sed -i '/android.defaults.buildfeatures.buildconfig/d' android/gradle.properties
          
          # 3. TIMPA file build.gradle.kts dengan format AGP 9.0 (Sekarang pakai SDK 36!)
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.base_zevora_v1"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              defaultConfig {
                  applicationId = "com.example.base_zevora_v1"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
              }
          }

          flutter {
              source = "../.."
          }
          EOF
          
          # 4. Paksa semua library pakai SDK 36
          sed -i 's/compileSdk = 34/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 36/g' android/app/build.gradle.kts
          
          # 5. Build APK
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "project_raw/BASE ZEVORA V1/build/app/outputs/flutter-apk/app-release.apk"
