name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip "BASE ZEVORA V1 baru.zip" -d project_raw

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'

      - name: Build APK
        run: |
          cd "project_raw/BASE ZEVORA V1"
          flutter pub get
          
          # 1. Paksa naikkan versi Gradle Wrapper menjadi 9.3.1
          sed -i 's/gradle-8.12-bin.zip/gradle-9.3.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. Paksa naikkan AGP ke 9.1.1 (jaga-jaga kalau di ZIP masih versi lama)
          sed -i 's/id("com.android.application") version "8.9.1"/id("com.android.application") version "9.1.1"/' android/settings.gradle.kts
          
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "project_raw/BASE ZEVORA V1/build/app/outputs/flutter-apk/app-release.apk"
