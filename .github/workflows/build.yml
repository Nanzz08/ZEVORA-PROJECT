- name: Build APK
  run: |
    cd "project_raw/BASE ZEVORA V1"
    flutter pub get
    
    # 1. Paksa naikkan versi Gradle Wrapper menjadi 9.3.1
    sed -i 's/gradle-8.12-all.zip/gradle-9.3.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
    sed -i 's/gradle-8.12-bin.zip/gradle-9.3.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
    
    # 2. Hapus baris 'android.defaults.buildfeatures.buildconfig' yang udah usang
    sed -i '/android.defaults.buildfeatures.buildconfig/d' android/gradle.properties
    
    # 3. TIMPA file build.gradle.kts dengan format AGP 9.0 (Modern DSL)
    cat << 'EOF' > android/app/build.gradle.kts
    plugins {
        id("com.android.application")
        id("kotlin-android")
        id("dev.flutter.flutter-gradle-plugin")
    }

    android {
        namespace = "com.example.base_zevora_v1" // Sesuaikan jika package name beda
        compileSdk = flutter.compileSdkVersion
        ndkVersion = flutter.ndkVersion

        compileOptions {
            sourceCompatibility = JavaVersion.VERSION_11
            targetCompatibility = JavaVersion.VERSION_11
        }

        defaultConfig {
            applicationId = "com.example.base_zevora_v1" // Sesuaikan jika package name beda
            minSdk = flutter.minSdkVersion
            targetSdk = flutter.targetSdkVersion
            versionCode = flutter.versionCode
            versionName = flutter.versionName
        }

        buildTypes {
            release {
                signingConfig = signingConfigs.getByName("debug")
            }
        }
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
        }
    }

    flutter {
        source = "../.."
    }
    EOF
    
    # 4. Build APK
    flutter build apk --release
