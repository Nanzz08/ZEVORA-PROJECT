name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip "BASE ZEVORA V1 baru.zip" -d project_raw

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'

      - name: Build APK
        run: |
          cd "project_raw/BASE ZEVORA V1"
          flutter pub get
          
          # 1. Paksa naikkan versi Gradle Wrapper menjadi 9.3.1
          sed -i 's/gradle-8.12-all.zip/gradle-9.3.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-8.12-bin.zip/gradle-9.3.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. Hapus baris 'android.defaults.buildfeatures.buildconfig' yang udah usang
          sed -i '/android.defaults.buildfeatures.buildconfig/d' android/gradle.properties
          
          # 3. Build APK
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "project_raw/BASE ZEVORA V1/build/app/outputs/flutter-apk/app-release.apk"
